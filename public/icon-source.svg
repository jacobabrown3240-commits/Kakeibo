<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (safe for maskable adaptive icons) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Three ascending bars = weekly spending -->
  <g fill="#ffffff">
    <rect x="150" y="300" width="52" height="70" rx="14"/>
    <rect x="230" y="240" width="52" height="130" rx="14"/>
    <rect x="310" y="180" width="52" height="190" rx="14"/>
  </g>
  <!-- Baseline -->
  <rect x="140" y="378" width="232" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
</svg>
